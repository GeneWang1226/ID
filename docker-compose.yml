services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - WEB_PASSWORD=${WEB_PASSWORD:-changeme}
      - DB_PATH=/app/data/id.db
      # AI 配置从根目录 .env 注入（容器内 nextjs 用户读不了 600 的文件，故走环境变量）
      - AI_API_KEY=${ai_api_key:-}
      - AI_BASE_URL=${ai_base_url:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - AI_MODEL=${ai_model:-qwen-plus}
    volumes:
      - ./data:/app/data
      - ./template:/app/template:ro
    restart: unless-stopped
