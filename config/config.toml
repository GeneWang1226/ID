# 可同步的非敏感配置。make ai / Web 每次调用都会重新读取。

[ai]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
model = "qwen3.8-max-0902"
thinking = false
thinking_budget = 8192

[terminal]
allow_plaintext = true

# 每台设备连接自己的 Syncthing；首次在 make settings 中选择同步目录和 NAS。
[syncthing]
enabled = false
api_url = "http://127.0.0.1:8384"
folder_id = ""
peer_device = ""
timeout_seconds = 60
